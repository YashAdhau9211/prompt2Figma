[phases.setup]
nixPkgs = ["python39", "nodejs-18_x"]

[phases.install]
cmds = [
  "cd prompt2Figma-Backend",
  "pip install -r requirements.txt",
  "npm install"
]

[phases.build]
cmds = ["echo 'Build complete'"]

[start]
cmd = "cd prompt2Figma-Backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
