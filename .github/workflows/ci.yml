name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ===================================
  # Backend Tests
  # ===================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.9, '3.10', 3.11]
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      working-directory: ./prompt2Figma-Backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio
    
    - name: Run tests with coverage
      working-directory: ./prompt2Figma-Backend
      env:
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/0
        REDIS_STATE_STORE_URL: redis://localhost:6379/1
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./prompt2Figma-Backend/coverage.xml
        flags: backend
        name: backend-coverage

  # ===================================
  # Frontend Tests
  # ===================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Cache node modules
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install dependencies
      working-directory: ./prompt2Figma-Frontend (Plugin)
      run: npm install
    
    - name: Run tests with coverage
      working-directory: ./prompt2Figma-Frontend (Plugin)
      run: npm run test:coverage
      continue-on-error: true
    
    - name: Build plugin
      working-directory: ./prompt2Figma-Frontend (Plugin)
      run: npm run build
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./prompt2Figma-Frontend (Plugin)/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage

  # ===================================
  # Linting & Code Quality
  # ===================================
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
    
    - name: Install Python linters
      run: |
        pip install flake8 black isort mypy
    
    - name: Run Python linters
      working-directory: ./prompt2Figma-Backend
      run: |
        flake8 app/ --max-line-length=100 --extend-ignore=E203,W503 || true
        black --check app/ || true
        isort --check-only app/ || true
      continue-on-error: true
    
    - name: Install Node dependencies
      working-directory: ./prompt2Figma-Frontend (Plugin)
      run: npm install
    
    - name: Run ESLint (if configured)
      working-directory: ./prompt2Figma-Frontend (Plugin)
      run: |
        if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ]; then
          npm run lint || echo "ESLint not configured"
        fi
      continue-on-error: true

  # ===================================
  # Security Scanning
  # ===================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true
    
    - name: Run npm audit
      working-directory: ./prompt2Figma-Frontend (Plugin)
      run: npm audit --audit-level=moderate
      continue-on-error: true
    
    - name: Run pip safety check
      working-directory: ./prompt2Figma-Backend
      run: |
        pip install safety
        safety check --json || true
      continue-on-error: true

  # ===================================
  # Build Verification
  # ===================================
  build-verification:
    name: Build Verification
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
    
    - name: Build Backend
      working-directory: ./prompt2Figma-Backend
      run: |
        pip install -r requirements.txt
        python -m py_compile app/**/*.py || true
    
    - name: Build Frontend
      working-directory: ./prompt2Figma-Frontend (Plugin)
      run: |
        npm install
        npm run build
    
    - name: Verify build artifacts
      working-directory: ./prompt2Figma-Frontend (Plugin)
      run: |
        test -f dist/code.js || exit 1
        test -f dist/ui.html || exit 1
      shell: bash
